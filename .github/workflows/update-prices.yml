name: Daily Price Update

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 8am AEST / 10pm London
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices and bake into data/prices.json
        run: python update-prices.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add regime-board.html index.html data/prices.json
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: daily price update $(date -u '+%Y-%m-%d')"
          # Same non-fast-forward guard as the property bake.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "could not push after 3 attempts"; exit 1
