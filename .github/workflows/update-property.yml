name: Daily Property Freshness Check

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC daily = 8am AEST, same slot as the price bake
  workflow_dispatch:
    inputs:
      force:
        description: 'Bake even if SQM has not published new data'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SQM publishes weekly (Tuesdays). This costs one request and decides
      # whether the 420-region bake is worth running today.
      - name: Check whether SQM has published new data
        id: fresh
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced by manual dispatch"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif python check-property-fresh.py; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bake data/property.json
        if: steps.fresh.outputs.stale == 'true'
        run: python update-property.py

      - name: Refresh the picks backtest
        if: steps.fresh.outputs.stale == 'true'
        run: python backtests/property-backtest.py --years 3 || true

      - name: Commit and push
        if: steps.fresh.outputs.stale == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/property.json backtests/property-picks-history.json
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "chore: property update $(date -u '+%Y-%m-%d')"
          # The bake takes ~1 hour, so main has usually moved on by now (the price
          # bake, or a manual publish). A plain push gets rejected as non-fast-
          # forward, the job fails, property.json never lands — and because the
          # committed data stays stale the freshness check re-bakes every single
          # day. Rebase and retry so that loop cannot start again.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed; retrying in 15s"
            sleep 15
          done
          echo "could not push after 3 attempts"; exit 1
