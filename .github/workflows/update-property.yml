name: Weekly Property Update

on:
  schedule:
    - cron: '0 16 * * 2'   # Tue 16:00 UTC = Wed 2am AEST — SQM publishes Tuesdays
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch SQM data and bake into data/property.json
        run: python update-property.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/property.json
          git diff --cached --quiet || git commit -m "chore: weekly property update $(date -u '+%Y-%m-%d')"
          git push
